{% extends 'base.html' %}{% block title %}Create account · SignaLab{% endblock %}{% block content %}<section class="card narrow auth-card"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">New accounts have standard user access. Admin permissions cannot be selected here.</p><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Full name<input name="name" required maxlength="100" autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="12" required autocomplete="new-password"><small class="muted">Use at least 12 characters.</small></label><button class="primary-button" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="{{url_for('login')}}">Sign in</a></p></section>{% endblock %}
