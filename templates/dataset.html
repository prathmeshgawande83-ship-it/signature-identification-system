{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Bulk import dataset</h1><p>Register the writer first, then select multiple images of that same writer. Maximum 100 files per upload.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{csrf}}"><label>Existing student's roll number<input name="roll_no" required></label><label>Sample label<select name="label"><option value="genuine">Genuine</option><option value="forged">Known imitation / forged</option></select></label><label>Signature images<input type="file" name="images" accept="image/*" multiple required></label><button>Import images</button></form><p class="muted">Public datasets may have licensing and label constraints. Do not assign arbitrary samples to the same writer.</p></section>{% endblock %}
